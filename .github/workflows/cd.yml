name: CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Environnement de déploiement
        required: true
        default: production
        type: choice
        options:
          - production

permissions: {}

jobs:
  ci-gate:
    name: verification-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read

    steps:
      - name: Attendre une CI verte
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            RESULT=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | [.status, .conclusion] | @tsv')

            STATUS=$(echo "$RESULT" | cut -f1)
            CONCLUSION=$(echo "$RESULT" | cut -f2)

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI verte."
                exit 0
              fi

              echo "CI en échec : $CONCLUSION"
              exit 1
            fi

            echo "Attente de la CI..."
            sleep 10
          done

          echo "Timeout en attente de la CI."
          exit 1

      - name: Déclenchement manuel
        if: github.event_name == 'workflow_dispatch'
        run: echo "Déploiement manuel autorisé."

  build-and-push:
    name: build-and-push
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    outputs:
      short-sha: ${{ steps.vars.outputs.short_sha }}
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Préparer les tags
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Construire l'image
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:$SHORT_SHA" \
            -t "$IMAGE_NAME:$VERSION" \
            ./starter-app

      - name: Pousser l'image
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$SHORT_SHA"
          docker push "$IMAGE_NAME:$VERSION"

  deploy:
    name: deploy
    needs: build-and-push

    if: >
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'

    runs-on:
      - self-hosted
      - linux
      - x64

    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connexion à GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Déployer
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.short-sha }}
          APP_VERSION: ${{ needs.build-and-push.outputs.version }}
          COMMIT_SHA: ${{ needs.build-and-push.outputs.short-sha }}
        run: |
          export IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          ./deploy/deploy.sh
